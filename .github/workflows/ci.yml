name: CI

on:
  push:
    branches:
      - main
      - docs/living-contracts
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/agynio/*
    steps:
      - uses: actions/checkout@v4

      - name: Configure Git for private modules
        run: git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          version: 1.66.0

      - name: Generate protobuf bindings
        # buf.gen.yaml pins the spk-ai/api revision; see its inputs.
        run: buf generate --include-imports --template buf.gen.yaml

      - name: Run tests
        run: go test ./...

      # Shell, MCP and init-script startup ordering are lifecycle work.
      - name: Run tests with the race detector
        run: go test -race -count=1 ./...

      - name: Build
        run: go build ./...
