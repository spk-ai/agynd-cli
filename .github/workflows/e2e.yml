name: E2E

on:
  push:
    branches: [main, docs/living-contracts]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/agynio/*
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Git for private modules
        run: git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Checkout agn-cli
        uses: actions/checkout@v4
        with:
          repository: agynio/agn-cli
          token: ${{ secrets.GITHUB_TOKEN }}
          path: .agn-cli

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          version: 1.66.0

      - name: Generate protobuf bindings
        # buf.gen.yaml pins the spk-ai/api revision; see its inputs.
        run: buf generate --include-imports --template buf.gen.yaml

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Run repo-local E2E tests
        run: go test -v -count=1 -tags e2e ./test/e2e/
        env:
          OPENAI_API_KEY: test-key
          AGN_REPO_PATH: ${{ github.workspace }}/.agn-cli
