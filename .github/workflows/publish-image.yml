name: Publish image

# Publishes one immutable agynd init image per integration commit,
# ghcr.io/spk-ai/agynd-cli-init:<commit>, for installations to pin by digest
# (the orchestrator's AGYND_CLI_INIT_IMAGE). Every run first builds linux/amd64
# and checks it the way a restricted workload uses it (test/initimage); the
# multi-platform push follows only a passing check. Other refs, including pull
# requests, push to a registry that exists only inside the job.
on:
  push:
    branches:
      - docs/living-contracts
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialize runs for one commit so a branch and tag push cannot race its tag.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_PATH: spk-ai/agynd-cli-init
  DOCKERFILE: Dockerfile.reporting-init
  PLATFORMS: linux/amd64,linux/arm64
  BUF_VERSION: 1.66.0
  BUF_SHA256: 32e8e7b236e1b9da4eb20ad3c7701a404f7909b18d60f6d00837c63b31d4e6cf
  # BuildKit and QEMU execute the Dockerfile, so pin them like the base images.
  BUILDKIT_IMAGE: docker.io/moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
  BINFMT_IMAGE: docker.io/tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
  ARM64_WORKSPACE_IMAGE: docker.io/library/debian:bookworm-slim@sha256:3783cc01769c7b2b1b83a5c5ad96c815348e28ed7da68e2e3687004faa906251

jobs:
  image:
    name: Build, check and publish the commit init image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Only the integration branch and v* tags log in, push to GHCR and attest.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    services:
      # Push target for runs that must not publish.
      registry:
        image: docker.io/library/registry:3.1.2@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
        ports:
          - 5000:5000
    outputs:
      image: ${{ steps.target.outputs.image }}
      digest: ${{ steps.verify.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require digest-pinned Dockerfile images
        run: |
          if grep -nE '^(# syntax=|FROM )' "$DOCKERFILE" | grep -vE '@sha256:[0-9a-f]{64}( |$)'; then
            echo "::error file=$DOCKERFILE::Pin every syntax and FROM image by digest."
            exit 1
          fi

      - name: Select destination
        id: target
        env:
          PUBLISH: ${{ github.ref == 'refs/heads/docs/living-contracts' || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ "$PUBLISH" = true ]; then
            image="ghcr.io/$IMAGE_PATH"
          else
            image="localhost:5000/$IMAGE_PATH"
          fi
          api="$(awk '$1 == "ref:" { print $2; exit }' buf.gen.yaml)"
          {
            echo "publish=$PUBLISH"
            echo "image=$image"
            echo "ref=$image:$GITHUB_SHA"
            echo "api=$api"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.target.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Look for an existing commit image
        id: existing
        env:
          IMAGE_REF: ${{ steps.target.outputs.ref }}
        run: |
          set -euo pipefail
          # Rebuilds are not byte-identical, so a published commit tag never moves.
          if manifest="$(docker buildx imagetools inspect "$IMAGE_REF" --format '{{json .Manifest}}' 2>"$RUNNER_TEMP/inspect.err")"; then
            digest="$(jq -er .digest <<<"$manifest")"
            echo "::notice title=Commit image exists::$IMAGE_REF is $digest; checking it without a rebuild."
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          elif grep -qF "$IMAGE_REF: not found" "$RUNNER_TEMP/inspect.err"; then
            echo "No $IMAGE_REF yet."
          else
            # Any other failure could hide an existing tag that a push would move.
            echo "::error::Cannot tell whether $IMAGE_REF exists: $(head -n 1 "$RUNNER_TEMP/inspect.err")"
            exit 1
          fi

      # The node stage copies the C++ runtime for each target platform, and
      # the arm64 check runs the delivered binaries.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: ${{ env.BINFMT_IMAGE }}
          platforms: arm64

      - name: Set up Docker Buildx
        if: steps.existing.outputs.digest == ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # The registry service needs host networking. In-image provenance
          # must not embed the triggering event payload (PR body, pusher).
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}
            network=host
            provenance-add-gha=false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Generate protobuf bindings for the check
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64" -o "$RUNNER_TEMP/buf"
          echo "${BUF_SHA256}  $RUNNER_TEMP/buf" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/buf"
          "$RUNNER_TEMP/buf" generate --include-imports --template buf.gen.yaml

      - name: Build linux/amd64 for the check
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: agynd-cli-init:check
          build-args: |
            AGYND_VERSION=${{ github.sha }}

      - name: Check the build as a restricted workload
        if: steps.existing.outputs.digest == ''
        env:
          INIT_IMAGE: agynd-cli-init:check
        run: go test -tags initimage -v -count=1 -timeout 10m ./test/initimage/

      - name: Build and push
        id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.target.outputs.ref }}
          build-args: |
            AGYND_VERSION=${{ github.sha }}
          # actions/attest signs the full build provenance.
          provenance: mode=min
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=agynd-cli-init
            io.smartphonekey.api.revision=${{ steps.target.outputs.api }}
          annotations: |
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify and report digest
        id: verify
        env:
          PUBLISH: ${{ steps.target.outputs.publish }}
          IMAGE: ${{ steps.target.outputs.image }}
          IMAGE_REF: ${{ steps.target.outputs.ref }}
          API: ${{ steps.target.outputs.api }}
          EXPECTED: ${{ steps.build.outputs.digest || steps.existing.outputs.digest }}
          REBUILT: ${{ steps.build.outputs.digest != '' }}
        run: |
          set -euo pipefail
          manifest="$(docker buildx imagetools inspect "$IMAGE_REF" --format '{{json .Manifest}}')"
          digest="$(jq -er .digest <<<"$manifest")"
          if [ "$digest" != "$EXPECTED" ]; then
            echo "::error::$IMAGE_REF resolves to $digest, expected $EXPECTED."
            exit 1
          fi
          platforms="$(jq -r '[.manifests[].platform | select(.os == "linux") | "linux/" + .architecture] | unique | join(",")' <<<"$manifest")"
          for platform in ${PLATFORMS//,/ }; do
            case ",$platforms," in
              *",$platform,"*) ;;
              *) echo "::error::$IMAGE_REF lacks $platform."; exit 1 ;;
            esac
          done
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Image: $IMAGE@$digest"
          {
            if [ "$PUBLISH" = true ]; then
              echo "## Published init image"
            else
              echo "## Verified init image build (not published)"
              echo
              echo "This run pushed only to its job-local registry."
            fi
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Image | \`$IMAGE\` |"
            echo "| Tag | \`$GITHUB_SHA\` |"
            echo "| Digest | \`$digest\` |"
            echo "| Pin (AGYND_CLI_INIT_IMAGE) | \`$IMAGE@$digest\` |"
            echo "| Platforms | \`$platforms\` |"
            echo "| API | \`spk-ai/api@$API\` |"
            echo "| Built by this run | $REBUILT |"
          } >> "$GITHUB_STEP_SUMMARY"

      # The check again, against the pushed index by digest: what an
      # installation pins is what was checked, not only the local build.
      - name: Check the pushed image as a restricted workload
        env:
          INIT_IMAGE: ${{ steps.target.outputs.image }}@${{ steps.verify.outputs.digest }}
        run: go test -tags initimage -v -count=1 -timeout 10m -run TestInitImageDeliversAReportingCapableAgynd ./test/initimage/

      - name: Check the pushed linux/arm64 image runs its delivery
        env:
          INIT_IMAGE: ${{ steps.target.outputs.image }}@${{ steps.verify.outputs.digest }}
        run: |
          set -euo pipefail
          # The amd64 images were pulled by these index digests already, and
          # Docker keeps one platform per digest: run the arm64 manifests.
          arm64() {
            local digest
            digest="$(docker buildx imagetools inspect "$1" --raw |
              jq -er '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest] | if length == 1 then .[0] else error("expected one linux/arm64 manifest") end')"
            echo "${1%@*}@$digest"
          }
          init="$(arm64 "$INIT_IMAGE")"
          workspace="$(arm64 "$ARM64_WORKSPACE_IMAGE")"
          agyn="$(mktemp -d)"
          chmod 0777 "$agyn"
          restricted=(--user 10001:10001 --read-only --cap-drop ALL --security-opt no-new-privileges --network none)
          docker run --rm --platform linux/arm64 "${restricted[@]}" -v "$agyn:/agyn" "$init"
          docker run --rm --platform linux/arm64 "${restricted[@]}" -v "$agyn:/agyn" "$workspace" \
            /bin/sh -c '/agyn/bin/node -e "if (process.arch !== \"arm64\") process.exit(1); console.log(process.version, process.arch)" && TERMINFO_DIRS=/agyn/terminfo /agyn/bin/tmux -V && test -x /agyn/bin/agynd'

      - name: Report whether the published image is publicly pullable
        if: steps.target.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.verify.outputs.digest }}
        run: |
          set -euo pipefail
          token="$(curl -fsS "https://ghcr.io/token?scope=repository:${IMAGE_PATH}:pull" | jq -r .token)"
          status="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json' "https://ghcr.io/v2/${IMAGE_PATH}/manifests/${DIGEST}")"
          if [ "$status" = 200 ]; then
            echo "::notice title=Anonymous pull::ghcr.io/${IMAGE_PATH}@${DIGEST} is publicly pullable."
          else
            echo "::warning title=Anonymous pull::ghcr.io/${IMAGE_PATH}@${DIGEST} returned HTTP $status anonymously; pull it with the ghcr-pull credential or make the package public."
          fi

      - name: Attest build provenance
        if: steps.target.outputs.publish == 'true' && steps.build.outputs.digest != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.target.outputs.image }}
          subject-digest: ${{ steps.verify.outputs.digest }}
          push-to-registry: true
          # Storage records would also need artifact-metadata: write.
          create-storage-record: false
