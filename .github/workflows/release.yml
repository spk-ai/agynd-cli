name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/agynio/agynd-cli
  INIT_IMAGE_NAME: ghcr.io/agynio/agynd-cli-init
  CHART_DIR: charts/agynd
  CHART_REGISTRY: oci://ghcr.io/agynio/charts

jobs:
  binary:
    name: Build and release binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          version: 1.66.0

      - name: Generate protobuf bindings
        # buf.gen.yaml pins the spk-ai/api revision; see its inputs.
        run: buf generate --include-imports --template buf.gen.yaml

      - name: Build binaries
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/agynd-linux-amd64 ./cmd/agynd
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/agynd-linux-arm64 ./cmd/agynd

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/agynd-linux-amd64
            dist/agynd-linux-arm64

  # Each architecture builds on its own runner. The init image compiles ncurses,
  # libevent and tmux from source; under QEMU the arm64 pass took ~25 minutes,
  # which is most of a release. Native runners are free for a public repository.
  image:
    name: Build ${{ matrix.arch }} images
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest and tagged by the manifest job, so a half-built release
      # never leaves a single-architecture tag behind.
      - name: Build and push
        id: agynd
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=agynd-cli-${{ matrix.arch }}
          cache-to: type=gha,scope=agynd-cli-${{ matrix.arch }},mode=max

      # The init-container form, injected into every workload. Same binary,
      # same version - only the delivery differs, so it releases here rather
      # than from a repository of its own.
      - name: Build and push the init image
        id: init
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.init
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.INIT_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=agynd-cli-init-${{ matrix.arch }}
          cache-to: type=gha,scope=agynd-cli-init-${{ matrix.arch }},mode=max

      # Digests travel as artifacts rather than job outputs: matrix legs share
      # one output namespace and would overwrite each other.
      - name: Record the digests
        env:
          AGYND_DIGEST: ${{ steps.agynd.outputs.digest }}
          INIT_DIGEST: ${{ steps.init.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests/agynd /tmp/digests/init
          touch "/tmp/digests/agynd/${AGYND_DIGEST#sha256:}"
          touch "/tmp/digests/init/${INIT_DIGEST#sha256:}"

      - name: Upload the digests
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Tag the multi-arch manifests
    runs-on: ubuntu-24.04
    needs: image
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          merge-multiple: true
          path: /tmp/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Extract Docker metadata for the init image
        id: meta-init
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.INIT_IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Tag both images from their per-architecture digests
        env:
          AGYND_TAGS: ${{ steps.meta.outputs.tags }}
          INIT_TAGS: ${{ steps.meta-init.outputs.tags }}
        run: |
          set -euo pipefail
          tag_image() {
            local image="$1" tags="$2" dir="$3"
            local args=()
            for tag in $tags; do
              args+=(-t "$tag")
            done
            local sources=()
            for digest in "$dir"/*; do
              sources+=("$image@sha256:$(basename "$digest")")
            done
            if [ "${#sources[@]}" -ne 2 ]; then
              echo "::error::expected one digest per architecture for $image, got ${#sources[@]}"
              exit 1
            fi
            docker buildx imagetools create "${args[@]}" "${sources[@]}"
          }
          tag_image "$IMAGE_NAME" "$AGYND_TAGS" /tmp/digests/agynd
          tag_image "$INIT_IMAGE_NAME" "$INIT_TAGS" /tmp/digests/init

      - name: Verify both manifests
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          for IMAGE in "$IMAGE_NAME" "$INIT_IMAGE_NAME"; do
            FOUND="$(docker buildx imagetools inspect "$IMAGE:$TAG" --raw | jq -r '[.manifests[].platform.architecture] | sort | join(",")')"
            MISSING=()
            for ARCH in amd64 arm64; do
              if ! echo "$FOUND" | grep -q "$ARCH"; then
                MISSING+=("linux/$ARCH")
              fi
            done
            if [ ${#MISSING[@]} -gt 0 ]; then
              echo "::error::Missing architectures in $IMAGE:$TAG: ${MISSING[*]}"
              exit 1
            fi
            echo "Manifest $IMAGE:$TAG includes linux/amd64 and linux/arm64"
          done

  helm:
    name: Package and push Helm chart
    runs-on: ubuntu-latest
    needs: manifest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine release version
        id: version
        run: |
          if [[ "${GITHUB_REF_NAME}" != v*.*.* ]]; then
            echo "Release tags must follow v*.*.*" >&2
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Log in to Helm registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build chart dependencies
        run: helm dependency build "$CHART_DIR"

      - name: Lint chart
        run: helm lint "$CHART_DIR"

      - name: Package chart
        run: |
          mkdir -p dist
          helm package "$CHART_DIR" \
            --destination dist \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}"

      - name: Push chart
        run: |
          CHART_NAME="$(basename "$CHART_DIR")"
          helm push "dist/${CHART_NAME}-${{ steps.version.outputs.version }}.tgz" "$CHART_REGISTRY"
