version: v2

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/agynio/agynd-cli/.gen/go
  disable:
    - file_option: go_package_prefix
      module: buf.build/opentelemetry/opentelemetry

# The integration branch builds against the spk-ai/api fork the deployed
# gateway and orchestrator forks are generated from, never a moving registry
# label: CI, E2E and the published init image all generate from this input.
inputs:
  - git_repo: https://github.com/spk-ai/api.git
    ref: f62e2ad47a5ea5451d88c3cc0138f73be708eb55
    subdir: proto
    paths:
      - agynio/api/gateway/v1

plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: .gen/go
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go:v1.6.1
    out: .gen/go
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false
